name: Main workflow

on:
  push:
    tags: [v*]
  pull_request:
    branches: [master]

env:
  APP_NAME: helloworld
  NODE_VERSION: 26.5

permissions:
  contents: read

jobs:
  test:
    name: Run tests, lint, and build
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - id: tests
        name: Run tests
        run: pnpm test
        background: true
      - id: lint
        name: Run lint
        run: pnpm lint
        background: true
      - id: build
        name: Build
        run: pnpm build
        background: true
      - id: wait
        name: Wait for background jobs to finish
        wait: [tests, lint, build]

  test-playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - id: setup-playwright
        name: Setup Playwright
        run: pnpm exec playwright install --with-deps
      - id: run-playwright
        name: Run Playwright tests
        run: pnpm exec playwright test
        timeout-minutes: 5
      - id: upload-playwright-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30

  test-build-image:
    name: Test building docker image
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-docker.yml
    permissions:
      contents: read
      packages: write

  test-ssh: # to catch ssh issues early, as the job using the connection is late in the workflow
    name: Test SSH connection to VPS
    runs-on: ubuntu-latest
    steps:
      - id: test-ssh
        name: Test SSH
        uses: burtek/setup-ssh@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          alias: production
          test_connection: true

  build-image-for-deploy:
    name: Build docker image
    needs: [test, test-playwright]
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/build-docker.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.sha }}
      push-images: true
      version: ${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-image-for-deploy, test-ssh]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - id: setup-ssh
        name: Setup SSH
        uses: burtek/setup-ssh@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          alias: production
          test_connection: true
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: deploy
        name: Deploy docker-compose and start app
        run: |
          ssh production '
              set -eu

              mkdir -p /apps/${{ env.APP_NAME }}
              cd /apps/${{ env.APP_NAME }}
              cat > docker-compose.yml.new
              mv docker-compose.yml.new docker-compose.yml

              export VERSION_TAG="${{ github.ref_name }}"

              docker compose pull
              docker compose up -d
          ' < docker-compose.yml

  post-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: label-release-pr
        name: "Add 'autorelease: published' label to the release PR"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          REPO="${{ github.repository }}"
          RELEASE_SHA="${{ github.sha }}"

          SOURCE_SHA="$(gh api "repos/$REPO/commits/$RELEASE_SHA" --jq '.parents[0].sha')"

          PR_NUMBER="$(gh api -H "Accept: application/vnd.github+json" "repos/$REPO/commits/$SOURCE_SHA/pulls" --jq 'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found for commit $SOURCE_SHA; skipping label."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "autorelease: published"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "✅ Release ${{ github.ref_name }} has been deployed to production."
