name: Main workflow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  APP_NAME: helloworld
  NODE_VERSION: 26.5

permissions:
  contents: read

jobs:
  test:
    name: Run tests, lint, and build
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: true
      - id: tests
        name: Run tests
        run: pnpm test
        background: true
      - id: lint
        name: Run lint
        run: pnpm lint
        background: true
      - id: build
        name: Build
        run: pnpm build
        background: true
      - id: wait
        name: Wait for background jobs to finish
        wait: [tests, lint, build]

  test-playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: true
      - id: install-playwright
        name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - id: run-playwirght
        name: Run Playwright tests
        run: pnpm exec playwright test
      - id: upload-playwright-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30

  test-ssh: #To catch ssh issues early, as the job using the connection is late in the workflow
    name: Test SSH connection to VPS
    runs-on: ubuntu-latest
    steps:
      - id: test-ssh
        name: Test SSH
        uses: burtek/setup-ssh@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          alias: production
          test_connection: true

  create-release:
    name: Create release
    needs: [test, test-playwright]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.output-version.outputs.version }}
      release-commit-sha: ${{ steps.output-version.outputs.release-commit-sha }}
    steps: 
      - id: checkout
        name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for standard-version to access tags
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: true
      - id: release
        name: Bump version and generate changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm exec commit-and-tag-version --no-verify #skips tests before release and on precommit
      - id: push
        name: Push release commit and tags
        uses: ad-m/github-push-action@v1.3.0
        with:
          branch: master
          tags: true
        background: true
      - id: output-version
        name: Output new version and release commit sha
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "release-commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        background: true
      - id: wait
        name: Wait for background jobs to finish
        wait: [push, output-version]

  build-alpine:
    name: Build assets on Alpine Linux
    needs: [test, test-playwright, create-release]
    if: >
      !cancelled()
        && needs.test.result == 'success'
        && needs.test-playwright.result == 'success'
        && (github.event_name == 'pull_request' || needs.create-release.result == 'success')
    runs-on: ubuntu-latest
    container:
      image: node:26-alpine
    env:
      ARTIFACT_NAME: build-output
      GIT_REF: ${{ github.event_name == 'push' && needs.create-release.outputs.release-commit-sha || github.sha }}
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - id: artifact
        run: echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
      - id: prepare-alpine
        name: Add tar for caching and python to build dependencies
        run: apk add --no-cache tar python3 py3-pip build-base
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF }}
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: true
          shell: sh
      - id: tests
        name: Run tests
        run: pnpm test
        background: true
      - id: build
        name: Build
        run: |
          echo "COMMIT_SHA=${{ env.GIT_REF }}" >> docker/backend/env
          VITE_COMMIT=${{ env.GIT_REF }} pnpm deploy
        background: true
      - id: wait
        name: Wait for background jobs to finish
        wait: [tests, build]
      - id: upload-artifact
        if: github.event_name == 'push'
        name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist-frontend
            dist-backend
            docker
            docker-compose.yml
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: [create-release, build-alpine, test-ssh]
    if: github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - id: setup-ssh
        name: Setup SSH
        uses: burtek/setup-ssh@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          alias: production
          test_connection: true
      - id: download-artifact
        name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-alpine.outputs.artifact-name }}
      - id: deploy-files
        name: Deploy build files
        run: |
          tar czf - dist-frontend dist-backend docker docker-compose.yml |
          ssh production '
              set -eu

              rm -rf /apps/${{ env.APP_NAME }}/upload /apps/${{ env.APP_NAME }}/old
              mkdir -p /apps/${{ env.APP_NAME }}/upload
              tar xzf - -C /apps/${{ env.APP_NAME }}/upload
          '
      - id: start-app
        name: Replace files and start new version of the app
        run: |
          ssh production '
              set -euo pipefail
              
              cd /apps/${{ env.APP_NAME }}
              if [ -f docker-compose.yml ]
              then
                docker compose stop
              fi

              rm -rf old
              mkdir -p old

              [ -f docker-compose.yml ] && mv docker-compose.yml old/
              [ -d docker ] && mv docker old/
              [ -d frontend ] && mv frontend old/
              [ -d backend ] && mv backend old/

              mv upload/docker-compose.yml docker-compose.yml
              mv upload/docker docker
              mv upload/dist-frontend frontend
              mv upload/dist-backend backend
              rmdir upload

              docker compose up -d
          '
