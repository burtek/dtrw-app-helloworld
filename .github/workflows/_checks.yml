name: Checks

on:
  workflow_call:

jobs:
  test:
    name: Run tests, lint, and build
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-pnpm
      - id: tests
        name: Run tests
        run: pnpm test
        background: true
      - id: lint
        name: Run lint
        run: pnpm lint
        background: true
      - id: build
        name: Build
        run: pnpm build
        background: true
      - id: wait
        name: Wait for background jobs to finish
        wait: [tests, lint, build]

  test-playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-pnpm
      - id: cache-playwright
        name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - id: install-playwright-deps
        name: Install system dependencies for Playwright
        run: sudo apt-get update && sudo apt-get install -y xvfb libgconf-2-4
      - id: setup-playwright
        name: Setup Playwright
        run: pnpm exec playwright install --with-deps
        timeout-minutes: 5
      - id: run-playwright
        name: Run Playwright tests
        run: pnpm exec playwright test
        timeout-minutes: 5
      - id: upload-playwright-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30
