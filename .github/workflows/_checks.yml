name: Checks

on:
  workflow_call:

jobs:
  get-playwright-version:
    name: Get Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: extract
        name: Extract Playwright version
        shell: bash
        run: |
          version=$(jq -r '.devDependencies."@playwright/test"' package.json | sed 's/^[^0-9]*//')
          echo "version=$version" >> $GITHUB_OUTPUT

  test:
    name: Run tests, lint, and build
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-pnpm
      - id: tests
        name: Run tests
        run: pnpm test
        background: true
      - id: lint
        name: Run lint
        run: pnpm lint
        background: true
      - id: build
        name: Build
        run: pnpm build
        background: true
      - id: wait
        name: Wait for background jobs to finish
        wait: [tests, lint, build]

  test-playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    needs: get-playwright-version
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-resolute
    env:
      HOME: /root
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v7
      - id: install-jq
        name: Install jq
        run: apt-get update && apt-get install -y jq
      - id: setup-node
        name: Setup node with pnpm
        uses: ./.github/actions/setup-pnpm
      - id: run-playwright
        name: Run Playwright tests
        run: pnpm exec playwright test
        timeout-minutes: 5
      - id: upload-playwright-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30
